# 公文风格（docx）：仿宋、红头标题居中、正文首行缩进2字、特定页边距
headings:
  h1: { size: 22, color: "#C00000", font: "方正小标宋简体", align: "center", bold: true }  # 红头标题，居中
  h2: { size: 16, color: "#000000", font: "黑体", align: "left" }
  h3: { size: 16, color: "#000000", font: "仿宋", align: "left" }
  h4: { size: 16, color: "#000000", font: "仿宋", align: "left" }
  h5: { size: 16, color: "#000000", font: "仿宋", align: "left" }
  h6: { size: 16, color: "#000000", font: "仿宋", align: "left" }
body:
  font: "仿宋"
  size: 16
  line_height: 1.8
  color: "#000000"
code:
  font: "Consolas"
  size: 11
  color: "#333333"
  background: "#F5F5F5"
# docx 专属扩展（下划线渲染器读取）
_docx:
  first_indent: 2          # 正文首行缩进 2 字符
  heading_align: "center"  # 标题默认居中
  margins:                 # 公文页边距（厘米）
    top: 3.7
    bottom: 3.5
    left: 2.8
    right: 2.6
