# Claude 风格（Anthropic 官网观感）：克制留白、衬线标题、柔和分割线、中性色
# 用于 html 与 ppt 复用
headings:
  h1: { size: 30, color: "#1A1A1A", font: "Georgia, 'Microsoft YaHei', 'PingFang SC', serif" }
  h2: { size: 24, color: "#1A1A1A", font: "Georgia, 'Microsoft YaHei', 'PingFang SC', serif" }
  h3: { size: 20, color: "#2A2A2A", font: "Georgia, 'Microsoft YaHei', 'PingFang SC', serif" }
  h4: { size: 17, color: "#2A2A2A", font: "Georgia, 'Microsoft YaHei', 'PingFang SC', serif" }
  h5: { size: 15, color: "#2A2A2A", font: "Georgia, 'Microsoft YaHei', 'PingFang SC', serif" }
  h6: { size: 14, color: "#2A2A2A", font: "Georgia, 'Microsoft YaHei', 'PingFang SC', serif" }
body:
  font: "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
  size: 16
  line_height: 1.7
  color: "#2A2A2A"
code:
  font: "Menlo, Monaco, Consolas, monospace"
  size: 14
  color: "#D6336C"
  background: "#F6F8FA"
divider_color: "#E5E7EB"
accent_color: "#D4A27F"
_docx:
  first_indent: 0
  heading_align: "left"
  margins: { top: 2.54, bottom: 2.54, left: 3.18, right: 3.18 }
