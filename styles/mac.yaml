# Mac 风格：圆角卡片、SF 字体栈、毛玻璃质感、系统配色
# 用于 html 与 ppt 复用
headings:
  h1: { size: 32, color: "#1D1D1F", font: "-apple-system, 'SF Pro Display', 'PingFang SC', sans-serif" }
  h2: { size: 26, color: "#1D1D1F", font: "-apple-system, 'SF Pro Display', 'PingFang SC', sans-serif" }
  h3: { size: 21, color: "#1D1D1F", font: "-apple-system, 'SF Pro Text', 'PingFang SC', sans-serif" }
  h4: { size: 18, color: "#1D1D1F", font: "-apple-system, 'SF Pro Text', 'PingFang SC', sans-serif" }
  h5: { size: 16, color: "#1D1D1F", font: "-apple-system, 'SF Pro Text', 'PingFang SC', sans-serif" }
  h6: { size: 15, color: "#1D1D1F", font: "-apple-system, 'SF Pro Text', 'PingFang SC', sans-serif" }
body:
  font: "-apple-system, 'SF Pro Text', 'PingFang SC', sans-serif"
  size: 16
  line_height: 1.6
  color: "#1D1D1F"
code:
  font: "SF Mono, Menlo, Monaco, monospace"
  size: 14
  color: "#0A84FF"
  background: "#F2F2F7"
card_background: "#F5F5F7"
card_radius: 12
accent_color: "#0A84FF"
_docx:
  first_indent: 0
  heading_align: "left"
  margins: { top: 2.54, bottom: 2.54, left: 3.18, right: 3.18 }
